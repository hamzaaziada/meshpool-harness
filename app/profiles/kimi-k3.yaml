# kimi-k3 profile: documentation + smoke tests (phase 3).
family: kimi
models: {planner: kimi-k3, worker: kimi-k3, verifier: kimi-k3}
match: ["kimi"]
caching: {mode: automatic_prefix}
tool_calling: {style: native, parallel: true, strict_schemas: true}
